name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile fusion360_arch_fix.py fusion360_bootstrap.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  shell:
    name: Bash and ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: bash -n install.sh install-fresh.sh repair.sh quick-install.sh check.sh publish-to-github.sh scripts/*.sh
      - name: ShellCheck
        run: shellcheck install.sh install-fresh.sh repair.sh quick-install.sh check.sh publish-to-github.sh scripts/*.sh

  arch-smoke:
    name: Arch Linux smoke test
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install test dependencies
        run: pacman -Syu --noconfirm git python bash shellcheck
      - uses: actions/checkout@v7
      - name: Compile and unit tests
        run: |
          python -m py_compile fusion360_arch_fix.py fusion360_bootstrap.py
          python -m unittest discover -s tests -v
      - name: Shell checks
        run: |
          bash -n install.sh install-fresh.sh repair.sh quick-install.sh check.sh publish-to-github.sh scripts/*.sh
          shellcheck install.sh install-fresh.sh repair.sh quick-install.sh check.sh publish-to-github.sh scripts/*.sh


  upstream-layout:
    name: Pinned upstream patch smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Clone pinned upstream and apply source patches twice
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile

          import fusion360_bootstrap as b

          root = Path(tempfile.mkdtemp(prefix="fusion-upstream-test-"))
          source = root / "upstream"
          try:
              subprocess.run(["git", "clone", "--no-tags", b.UPSTREAM_URL, str(source)], check=True)
              subprocess.run(["git", "checkout", "--detach", b.PINNED_UPSTREAM_REF], cwd=source, check=True)
              b.patch_upstream_tree(source)
              b.patch_upstream_tree(source)

              process = (source / "share/process.fn").read_text()
              assert "# Fusion Arch Fixes: prefix-scoped process shutdown" in process
              assert "pgrep -u \"$user\" -f" not in process.split("# ── Installer-specific kill", 1)[0]

              browser = (source / "src/runtime/fusion-browser.sh").read_text()
              assert "arguments_redacted=true" in browser
              assert 'chmod 700 "$REQUEST_DIR"' in browser

              listener = (source / "src/runtime/fusion-browser-listener.sh").read_text()
              assert "url_first300=" not in listener
              assert "url_last300=" not in listener
              assert "printf 'callback_url=%q" not in listener
              assert 'chmod 700 "$CALLBACK_REQUEST_DIR"' in listener

              deps = (source / "src/install/distro/arch.txt").read_text().splitlines()
              assert "tk" in deps
              assert "python3-tk" not in deps
              assert "glib2" in deps
          finally:
              shutil.rmtree(root, ignore_errors=True)
          PY
